services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://csinder:csinder@db:5432/csinder?sslmode=disable
      - FACEIT_CLIENT_ID=${FACEIT_CLIENT_ID}
      - FACEIT_CLIENT_SECRET=${FACEIT_CLIENT_SECRET}
      - FACEIT_API_KEY=${FACEIT_API_KEY}
      - FACEIT_REDIRECT_URI=${FACEIT_REDIRECT_URI:-http://localhost:8080/auth/callback}
      - COOKIE_SECRET=${COOKIE_SECRET:-change-me-in-production}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=csinder
      - POSTGRES_PASSWORD=csinder
      - POSTGRES_DB=csinder
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csinder"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
